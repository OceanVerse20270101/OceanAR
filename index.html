<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>OceanAR · 潛水員實境面鏡</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131c;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
#camera,#scene{position:fixed;inset:0;width:100%;height:100%}
#camera{object-fit:cover}

/* 淺海濾鏡與氣泡 */
#ocean-filter{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;background:linear-gradient(180deg,rgba(0,100,155,.24),rgba(0,150,180,.13) 55%,rgba(0,70,145,.29));mix-blend-mode:screen}
#ocean-filter::before{content:"";position:absolute;inset:-35%;background:repeating-linear-gradient(112deg,transparent 0 55px,rgba(160,245,255,.10) 70px,transparent 110px);transform-origin:center top;animation:rays 9s ease-in-out infinite alternate}
#ocean-filter::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 5%,rgba(160,240,255,.20),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
.bubble{position:absolute;bottom:-12vh;left:var(--x);width:var(--s);height:var(--s);border:1.5px solid rgba(210,255,255,.55);border-radius:50%;box-shadow:inset -2px -2px 5px rgba(185,245,255,.2),0 0 8px rgba(190,255,255,.15);animation:float-up var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes float-up{from{transform:translate3d(0,0,0);opacity:0}10%{opacity:.65}85%{opacity:.6}to{transform:translate3d(var(--drift),-125vh,0);opacity:0}}
@keyframes rays{from{transform:translateX(-10%) rotate(-7deg)}to{transform:translateX(12%) rotate(7deg)}}
@keyframes glow{from{opacity:.4}to{opacity:1}}

/* 深海模式與探照光圈 */
#deep-filter{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;overflow:hidden;background:linear-gradient(180deg,rgba(1,13,39,.72),rgba(0,20,54,.79) 55%,rgba(0,8,31,.86))}
#deep-filter::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 48% 15%,rgba(44,137,186,.22),transparent 55%);animation:deep-pulse 9s ease-in-out infinite alternate}
#deep-flashlight{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;background:radial-gradient(circle 42vmax at 50% 48%,rgba(130,225,255,.16) 0%,rgba(20,90,140,.08) 45%,rgba(0,6,20,.68) 100%);mix-blend-mode:screen}
.marine-snow{position:absolute;bottom:-8vh;left:var(--x);width:var(--s);height:var(--s);background:rgba(141,228,242,.68);border-radius:50%;box-shadow:0 0 8px rgba(99,213,255,.45);animation:float-up var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes deep-pulse{from{opacity:.4}to{opacity:1}}
body.deep #deep-filter,body.deep #deep-flashlight{display:block}
body.deep #sunlight,body.deep #ocean-filter{display:none!important}

/* 陽光折射 */
#sunlight{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;mix-blend-mode:screen;opacity:.85}
#sunlight .sun-glow{position:absolute;inset:-10%;background:radial-gradient(ellipse 60% 48% at 26% -8%,rgba(255,251,204,.32),rgba(142,227,255,.10) 43%,transparent 76%);animation:sun-breathe 8s ease-in-out infinite alternate}
#sunlight .sun-rays{position:absolute;left:-30%;top:-45%;width:160%;height:165%;transform-origin:35% 0%;background:repeating-conic-gradient(from 160deg at 35% 0%,rgba(255,252,215,0) 0deg,rgba(255,250,205,.14) 3deg,rgba(255,248,205,.035) 7deg,transparent 12deg,transparent 20deg);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.55) 55%,transparent 96%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.55) 55%,transparent 96%);animation:sun-sway 11s ease-in-out infinite alternate}
#sunlight .caustics{position:absolute;inset:-20%;background:repeating-linear-gradient(112deg,transparent 0 65px,rgba(205,250,255,.075) 72px,transparent 91px),repeating-linear-gradient(65deg,transparent 0 120px,rgba(190,246,255,.045) 132px,transparent 150px);filter:blur(9px);opacity:.7;animation:caustic-drift 13s ease-in-out infinite alternate}
@keyframes sun-sway{from{transform:rotate(-5deg) translateX(-2%);opacity:.65}to{transform:rotate(6deg) translateX(3%);opacity:1}}
@keyframes sun-breathe{from{opacity:.65;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}
@keyframes caustic-drift{from{transform:translate(-4%,-2%) rotate(-3deg)}to{transform:translate(4%,3%) rotate(4deg)}}

#scene{pointer-events:none;z-index:2}

/* ================= 潛水員面鏡 HUD 介面 ================= */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
.hud-corner{position:fixed;width:22px;height:22px;border-color:rgba(155,235,255,.45);border-style:solid}
.hud-tl{top:max(14px,env(safe-area-inset-top));left:14px;border-width:2px 0 0 2px;border-top-left-radius:6px}
.hud-tr{top:max(14px,env(safe-area-inset-top));right:14px;border-width:2px 2px 0 0;border-top-right-radius:6px}
.hud-bl{bottom:max(14px,env(safe-area-inset-bottom));left:14px;border-width:0 0 2px 2px;border-bottom-left-radius:6px}
.hud-br{bottom:max(14px,env(safe-area-inset-bottom));right:14px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}

#compass-wrap{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(280px,72vw);height:44px;background:rgba(4,22,40,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(155,235,255,.32);border-radius:22px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#compass-ticks{position:absolute;top:0;left:0;width:720px;height:100%;display:flex;align-items:flex-end;justify-content:space-between;background-image:repeating-linear-gradient(90deg,rgba(180,240,255,.5) 0 1px,transparent 1px 15px);background-size:100% 10px;background-repeat:no-repeat;background-position:bottom;will-change:transform}
#compass-center-mark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:10px;background:#5ce1e6;box-shadow:0 0 6px #5ce1e6}
#compass-heading{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:1px;color:#bce8fa}
#turtle-blip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:15px;line-height:1;filter:drop-shadow(0 0 6px #20e49b);transition:left .08s linear,filter .2s}
#turtle-blip.offscreen{filter:drop-shadow(0 0 6px #ffbe3d) grayscale(.2)}

#ar-badge{position:fixed;top:calc(max(18px,env(safe-area-inset-top)) + 52px);left:22px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;color:rgba(210,248,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#20e49b;box-shadow:0 0 8px #20e49b;animation:blink-dot 1.8s ease-in-out infinite}
@keyframes blink-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

#depth-gauge{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;background:rgba(4,22,40,.52);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(155,235,255,.28);border-radius:14px;padding:10px 10px 10px 12px;color:#e0f7ff}
.depth-readout{text-align:right}
.depth-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:#5ce1e6;line-height:1.2}
.temp-val{font-size:11px;color:#bce8fa;opacity:.85;font-variant-numeric:tabular-nums}
.depth-scale{width:6px;height:68px;border-radius:3px;background:repeating-linear-gradient(180deg,rgba(180,240,255,.65) 0 2px,transparent 2px 8px);position:relative}
#depth-marker{position:absolute;left:-3px;top:12%;width:12px;height:3px;background:#20e49b;border-radius:2px;box-shadow:0 0 6px #20e49b;transition:top .6s cubic-bezier(.22,1,.36,1)}

.edge-hint{position:fixed;top:50%;transform:translateY(-50%);padding:8px 12px;border-radius:999px;background:rgba(4,22,40,.75);border:1px solid rgba(92,225,230,.55);color:#fff;font-size:13px;font-weight:700;display:none;align-items:center;gap:4px;box-shadow:0 0 15px rgba(0,198,255,.35);animation:hint-pulse 1.2s ease-in-out infinite}
#hint-left{left:16px}
#hint-right{right:16px}
@keyframes hint-pulse{0%,100%{opacity:.95;transform:translateY(-50%) scale(1)}50%{opacity:.55;transform:translateY(-50%) scale(.95)}}

.tap-bubble{position:fixed;z-index:3;pointer-events:none;border-radius:50%;border:1.5px solid rgba(255,236,160,.9);background:radial-gradient(circle at 30% 30%,rgba(255,250,210,.8),rgba(255,205,80,.15));box-shadow:0 0 10px rgba(255,215,100,.6);animation:tap-rise var(--dur) ease-out forwards}
@keyframes tap-rise{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 140px)) scale(1.25);opacity:0}
}

#panel{display:block;position:fixed;z-index:5;left:50%;transform:translateX(-50%);width:max-content;max-width:88vw;top:calc(max(18px,env(safe-area-inset-top)) + 76px);padding:6px 14px;border-radius:16px;background:rgba(4,20,38,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(174,229,255,.22);color:white;text-align:center;font-size:13px;pointer-events:none;transition:opacity .4s}

#controls{position:fixed;z-index:6;left:0;right:0;bottom:max(32px,env(safe-area-inset-bottom));display:none;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px;box-sizing:border-box}
button{border:0;border-radius:14px;padding:13px 18px;background:#00a9ee;color:white;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
#shallow-btn,#deep-btn{background:rgba(5,29,55,.72);border:1px solid rgba(174,229,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:15px;padding:12px 14px}
#shallow-btn[aria-pressed="true"],#deep-btn[aria-pressed="true"]{background:rgba(14,121,165,.95);border-color:#c1f2ff;box-shadow:0 0 0 2px rgba(185,239,255,.25)}
#reset{background:rgba(22,78,114,.85);border:1px solid rgba(174,229,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:15px;padding:12px 14px}

/* 開場歡迎遮罩與海洋標題動畫 */
#start-overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#0f456e,#04111d 80%);color:#fff;overflow:hidden}
#start-overlay::before{content:"";position:absolute;inset:-40%;background:radial-gradient(ellipse at 50% 20%,rgba(110,231,255,.18),transparent 60%);animation:glow 5s ease-in-out infinite alternate;pointer-events:none}
.hero-badge{font-size:44px;margin-bottom:6px;display:inline-block;animation:float-title 3.6s ease-in-out infinite,fade-up .8s ease-out both;filter:drop-shadow(0 6px 16px rgba(0,198,255,.45))}
#start-overlay h1{
  margin:0 0 14px;font-size:38px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#ffffff 0%,#7be6ff 35%,#ffffff 65%,#5ce1e6 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(0,198,255,.35));
  animation:shimmer-wave 4.5s linear infinite,float-title 4s ease-in-out infinite,fade-up .8s ease-out .12s both;
}
#start-overlay p{margin:0 0 34px;max-width:300px;line-height:1.65;color:#bce8fa;font-size:15px;animation:fade-up .8s ease-out .26s both}
#start-btn{position:relative;padding:16px 38px;font-size:18px;border-radius:999px;background:linear-gradient(135deg,#00c6ff,#0072ff);box-shadow:0 8px 25px rgba(0,169,238,.45);transition:transform .15s;animation:fade-up .8s ease-out .4s both,btn-pulse 2.8s ease-in-out infinite 1.2s}
#start-btn:active{transform:scale(.95)}

@keyframes float-title{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shimmer-wave{0%{background-position:0% center}100%{background-position:200% center}}
@keyframes fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes btn-pulse{0%,100%{box-shadow:0 8px 25px rgba(0,169,238,.45),0 0 0 0 rgba(0,198,255,.45)}50%{box-shadow:0 8px 30px rgba(0,169,238,.65),0 0 0 12px rgba(0,198,255,0)}}
@media (prefers-reduced-motion:reduce){#sunlight *,#start-overlay *,.rec-dot,.edge-hint{animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>

<!-- 開場畫面 -->
<div id="start-overlay">
  <div class="hero-badge" aria-hidden="true">🌊</div>
  <h1>OceanAR</h1>
  <p>點擊下方按鈕並允許「動作與方向」及「相機」權限，即可在真實空間中看見海龜與魚群悠游。</p>
  <button id="start-btn" type="button">開始體驗 AR</button>
</div>

<video id="camera" autoplay muted playsinline></video>
<div id="ocean-filter" aria-hidden="true"></div>
<div id="deep-filter" aria-hidden="true"></div>
<div id="deep-flashlight" aria-hidden="true"></div>
<div id="sunlight" aria-hidden="true"><div class="sun-glow"></div><div class="sun-rays"></div><div class="caustics"></div></div>

<!-- 潛水員面鏡 HUD -->
<div id="hud" aria-hidden="true">
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <div id="compass-wrap">
    <div id="compass-center-mark"></div>
    <div id="compass-heading">000° N</div>
    <div id="compass-ticks"></div>
    <div id="turtle-blip">🐢</div>
  </div>

  <div id="ar-badge"><span class="rec-dot"></span><span>AR TRACKING</span></div>

  <div id="depth-gauge">
    <div class="depth-readout">
      <div class="depth-val" id="depth-text">12.5m</div>
      <div class="temp-val" id="temp-text">26°C</div>
    </div>
    <div class="depth-scale"><div id="depth-marker"></div></div>
  </div>

  <div id="hint-left" class="edge-hint">◀ 往左尋找 🐢</div>
  <div id="hint-right" class="edge-hint">🐢 往右尋找 ▶</div>
</div>

<div id="panel">準備就緒，請點擊「開始體驗 AR」</div>
<div id="controls">
  <button id="shallow-btn" type="button" aria-pressed="true">☀️ 淺海</button>
  <button id="deep-btn" type="button" aria-pressed="false">🌑 深海</button>
  <button id="reset" type="button">重新定位</button>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

const video=document.getElementById('camera'),status=document.getElementById('panel');
const reset=document.getElementById('reset');
const controls=document.getElementById('controls');
const hud=document.getElementById('hud');
const startOverlay=document.getElementById('start-overlay');
const startBtn=document.getElementById('start-btn');
const oceanFilter=document.getElementById('ocean-filter');
const sunlight=document.getElementById('sunlight');
const deepFilter=document.getElementById('deep-filter');
const shallowBtn=document.getElementById('shallow-btn');
const deepBtn=document.getElementById('deep-btn');

const compassTicks=document.getElementById('compass-ticks');
const compassHeading=document.getElementById('compass-heading');
const turtleBlip=document.getElementById('turtle-blip');
const hintLeft=document.getElementById('hint-left');
const hintRight=document.getElementById('hint-right');
const depthText=document.getElementById('depth-text');
const tempText=document.getElementById('temp-text');
const depthMarker=document.getElementById('depth-marker');

let currentDepth=12.5,targetDepth=12.5,currentTemp=26,targetTemp=26,depthAnimId=null;
function animateDepthGauge(toDepth,toTemp,markerPercent){
 targetDepth=toDepth;targetTemp=toTemp;
 depthMarker.style.top=markerPercent+'%';
 if(depthAnimId)cancelAnimationFrame(depthAnimId);
 function step(){
  currentDepth+=(targetDepth-currentDepth)*0.12;
  currentTemp+=(targetTemp-currentTemp)*0.12;
  depthText.textContent=currentDepth.toFixed(1)+'m';
  tempText.textContent=Math.round(currentTemp)+'°C';
  if(Math.abs(targetDepth-currentDepth)>0.15){
   depthAnimId=requestAnimationFrame(step);
  }else{
   currentDepth=targetDepth;currentTemp=targetTemp;
   depthText.textContent=currentDepth.toFixed(1)+'m';
   tempText.textContent=Math.round(currentTemp)+'°C';
  }
 }
 step();
}

// 儲存小魚群的陣列，方便切換淺海/深海顏色
const fishSchool=[];

function setOceanMode(mode){
 const isDeep=mode==='deep';
 document.body.classList.toggle('deep',isDeep);
 shallowBtn.setAttribute('aria-pressed',String(!isDeep));
 deepBtn.setAttribute('aria-pressed',String(isDeep));

 // 切換小魚群的外觀：淺海為熱帶暖色系，深海為發光生物冷藍光
 for(const fish of fishSchool){
  if(isDeep){
   fish.bodyMat.color.setHex(0x164e78);
   fish.bodyMat.emissive.setHex(0x00d4ff);
   fish.bodyMat.emissiveIntensity=0.85;
   fish.finMat.color.setHex(0x4ef2ff);
   fish.finMat.emissive.setHex(0x00aaff);
   fish.finMat.emissiveIntensity=0.9;
  }else{
   fish.bodyMat.color.setHex(fish.shallowColor);
   fish.bodyMat.emissive.setHex(0x000000);
   fish.bodyMat.emissiveIntensity=0;
   fish.finMat.color.setHex(fish.shallowFinColor);
   fish.finMat.emissive.setHex(0x000000);
   fish.finMat.emissiveIntensity=0;
  }
 }

 if(isDeep){
  animateDepthGauge(850.0,4,82);
 }else{
  animateDepthGauge(12.5,26,14);
 }
}
shallowBtn.addEventListener('click',(e)=>{e.stopPropagation();setOceanMode('shallow');});
deepBtn.addEventListener('click',(e)=>{e.stopPropagation();setOceanMode('deep');});

for(let i=0;i<45;i++){
 const p=document.createElement('span');p.className='marine-snow';
 p.style.setProperty('--x',`${(i*47+9)%100}%`);
 p.style.setProperty('--s',`${1+(i%3)}px`);
 p.style.setProperty('--d',`${12+(i*7)%19}s`);
 p.style.setProperty('--delay',`${-(i*1.73)%28}s`);
 p.style.setProperty('--drift',`${(i%2?1:-1)*(10+(i*11)%50)}px`);
 deepFilter.appendChild(p);
}
for(let i=0;i<28;i++){
 const bubble=document.createElement('span');bubble.className='bubble';
 bubble.style.setProperty('--x',`${(i*37+11)%100}%`);
 bubble.style.setProperty('--s',`${5+(i*7)%18}px`);
 bubble.style.setProperty('--d',`${6+(i*13)%10}s`);
 bubble.style.setProperty('--delay',`${-(i*1.37)%15}s`);
 bubble.style.setProperty('--drift',`${(i%2?1:-1)*(12+(i*9)%65)}px`);
 oceanFilter.appendChild(bubble);
}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(96.7,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.domElement.id='scene';
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526a78,2.2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);

const anchor=new THREE.Group();
anchor.position.set(-0.057823,-0.98064,-4.0781);
scene.add(anchor);

const ball=new THREE.Mesh(new THREE.SphereGeometry(.32,32,24),new THREE.MeshStandardMaterial({color:0x20e49b,roughness:.5}));
anchor.add(ball);

// ================= 純程式打造 3D 伴游小魚群 =================
const fishSchoolGroup=new THREE.Group();
fishSchoolGroup.position.copy(anchor.position);
scene.add(fishSchoolGroup);

// 共用幾何形狀（流線型身體＋三角尾鰭＋背鰭）
const bodyGeo=new THREE.SphereGeometry(1,16,12);
bodyGeo.scale(1.8,0.75,0.45); // 拉長壓扁成魚身比例

const tailGeo=new THREE.ConeGeometry(0.65,1.2,4);
tailGeo.rotateZ(Math.PI/2); // 尖端朝前接在魚尾

const dorsalGeo=new THREE.ConeGeometry(0.45,0.8,4);

const tropicalPalettes=[
 {body:0xff9f1c,fin:0xfff3b0}, // 橘黃熱帶魚
 {body:0xff5964,fin:0xffe74c}, // 珊瑚紅小魚
 {body:0x38b6ff,fin:0xffd166}, // 雀鯛藍黃魚
 {body:0xffbe0b,fin:0xffffff}  // 黃金小魚
];

function createProceduralFish(index){
 const palette=tropicalPalettes[index%tropicalPalettes.length];
 const group=new THREE.Group();

 const bodyMat=new THREE.MeshStandardMaterial({
  color:palette.body,
  roughness:0.35,
  metalness:0.1
 });
 const finMat=new THREE.MeshStandardMaterial({
  color:palette.fin,
  roughness:0.45
 });

 // 魚身體
 const body=new THREE.Mesh(bodyGeo,bodyMat);
 group.add(body);

 // 背鰭
 const dorsal=new THREE.Mesh(dorsalGeo,finMat);
 dorsal.position.set(-0.1,0.75,0);
 dorsal.rotation.z=0.35;
 group.add(dorsal);

 // 尾鰭樞紐（方便左右擺動）
 const tailPivot=new THREE.Group();
 tailPivot.position.set(-1.55,0,0);
 const tail=new THREE.Mesh(tailGeo,finMat);
 tail.position.set(-0.45,0,0);
 tail.scale.set(1,1.1,0.2);
 tailPivot.add(tail);
 group.add(tailPivot);

 // 隨機大小（約 8cm ~ 15cm 的小魚）
 const scale=0.045+Math.random()*0.032;
 group.scale.setScalar(scale);

 fishSchoolGroup.add(group);

 // 每隻魚擁有獨立的繞行軌道半徑、高度、速度與相位，營造自然徘徊感
 fishSchool.push({
  mesh:group,
  tailPivot,
  bodyMat,
  finMat,
  shallowColor:palette.body,
  shallowFinColor:palette.fin,
  radiusX:0.9+Math.random()*1.4,
  radiusZ:0.8+Math.random()*1.3,
  baseY:(Math.random()-0.5)*1.2,
  bobAmp:0.08+Math.random()*0.12,
  speed:(0.35+Math.random()*0.35)*(index%2===0?1:-1), // 一半順時針、一半逆時針交錯游動
  phase:Math.random()*Math.PI*2,
  tailSpeed:10+Math.random()*6
 });
}

// 生成 12 隻在海龜周圍徘徊的小魚
for(let i=0;i<12;i++){
 createProceduralFish(i);
}

let mixer=null,active=false,orientationReady=false,hasOrientation=false,latestQ=new THREE.Quaternion(),trackingGranted=false,modelReady=false;
let initialRecenterDone=false;
let boostTimer=0;

const basePosition=new THREE.Vector3(-0.057823,-0.98064,-4.0781);
let swimTime=0;
const originQ=new THREE.Quaternion(),inverseOriginQ=new THREE.Quaternion(),relativeQ=new THREE.Quaternion();
let latestBeta=null,originBeta=null;
const trackedEuler=new THREE.Euler(0,0,0,'YXZ');
const clock=new THREE.Clock();
const zee=new THREE.Vector3(0,0,1),screenQ=new THREE.Quaternion(),deviceQ=new THREE.Quaternion();
const correction=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const euler=new THREE.Euler(0,0,0,'YXZ');

function readOrientation(event){
 if(event.alpha==null||event.beta==null||event.gamma==null)return;
 euler.set(THREE.MathUtils.degToRad(event.beta),THREE.MathUtils.degToRad(event.alpha),-THREE.MathUtils.degToRad(event.gamma),'YXZ');
 deviceQ.setFromEuler(euler);deviceQ.multiply(correction);
 const angle=screen.orientation?.angle??window.orientation??0;
 screenQ.setFromAxisAngle(zee,-THREE.MathUtils.degToRad(Number(angle)));
 latestQ.copy(deviceQ).multiply(screenQ);
 latestBeta=THREE.MathUtils.degToRad(event.beta);
 hasOrientation=true;

 if(!initialRecenterDone && active && trackingGranted){
  initialRecenterDone=true;
  recenter();
 }
}
window.addEventListener('deviceorientation',readOrientation,true);

function recenter(){
 if(!trackingGranted){status.textContent='尚未取得方向權限；點「重新定位」可嘗試授權';return;}
 if(!hasOrientation){status.textContent='等待方向感測器資料，請輕輕轉動手機';return;}
 originQ.copy(latestQ);
 inverseOriginQ.copy(originQ).invert();
 originBeta=latestBeta;
 camera.quaternion.identity();
 anchor.position.copy(basePosition);
 fishSchoolGroup.position.copy(basePosition);
 swimTime=0;
 orientationReady=true;
 status.textContent=modelReady?'輕點螢幕可餵食氣泡互動 ✨':'空間已定位｜海龜模型載入中…';
}

startBtn.addEventListener('click',async()=>{
 startBtn.disabled=true;
 startBtn.textContent='正在啟動…';

 if(typeof DeviceOrientationEvent!=='undefined'){
  try{
   if(typeof DeviceOrientationEvent.requestPermission==='function'){
    const permission=await DeviceOrientationEvent.requestPermission();
    if(permission!=='granted')throw new Error('方向感測器權限遭拒');
   }
   trackingGranted=true;
  }catch(error){
   status.textContent='方向追蹤無法啟動：'+error.message;
   startBtn.disabled=false;
   startBtn.textContent='重新嘗試啟動';
   return;
  }
 }

 try{
  status.textContent='正在請求相機權限…';
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  video.srcObject=stream;
  await video.play();
  
  startOverlay.style.display='none';
  controls.style.display='flex';
  hud.style.display='block';
  oceanFilter.style.display='block';
  sunlight.style.display='block';
  active=true;

  if(typeof DeviceOrientationEvent==='undefined'){
   status.textContent='相機已啟動｜此裝置不支援方向感測器';
  }else if(hasOrientation){
   initialRecenterDone=true;
   recenter();
  }else{
   status.textContent='相機已啟動｜請輕輕轉動手機以完成空間定位';
  }
 }catch(err){
  status.textContent='相機無法啟動：'+err.message+'｜請確認瀏覽器相機權限';
  startBtn.disabled=false;
  startBtn.textContent='重新嘗試啟動';
 }
});

reset.addEventListener('click',async(e)=>{
 e.stopPropagation();
 if(!trackingGranted && typeof DeviceOrientationEvent!=='undefined'){
  try{
   if(typeof DeviceOrientationEvent.requestPermission==='function'){
    const permission=await DeviceOrientationEvent.requestPermission();
    if(permission!=='granted')throw new Error('方向感測器權限遭拒');
   }
   trackingGranted=true;
  }catch(error){status.textContent='方向追蹤無法啟動：'+error.message;return;}
 }
 recenter();
});

window.addEventListener('pointerdown',(e)=>{
 if(!active)return;
 boostTimer=2.2;
 for(let i=0;i<7;i++){
  const b=document.createElement('span');
  b.className='tap-bubble';
  const size=8+Math.random()*14;
  b.style.width=size+'px';
  b.style.height=size+'px';
  b.style.left=(e.clientX+(Math.random()-0.5)*36)+'px';
  b.style.top=(e.clientY+(Math.random()-0.5)*24)+'px';
  b.style.setProperty('--dx',`${(Math.random()-0.5)*70}px`);
  b.style.setProperty('--dur',`${0.9+Math.random()*0.7}s`);
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),1700);
 }
});

const draco=new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader=new GLTFLoader();loader.setDRACOLoader(draco);
const modelURL=new URL('./turtle.glb',window.location.href).href;

async function loadTurtle(){
 try{
  const response=await fetch(modelURL+'?v=5',{cache:'no-store'});
  if(!response.ok)throw Error('模型網址 HTTP '+response.status+'，請確認 GitHub 上有 turtle.glb');
  const bytes=await response.arrayBuffer();
  const signature=new TextDecoder().decode(bytes.slice(0,4));
  if(signature!=='glTF')throw Error('下載的不是有效 GLB，檔案開頭：'+signature);
  loader.parse(bytes,modelURL.substring(0,modelURL.lastIndexOf('/')+1),gltf=>{
   const turtle=gltf.scene;
   turtle.updateMatrixWorld(true);
   const bounds=new THREE.Box3().setFromObject(turtle);
   const size=bounds.getSize(new THREE.Vector3());
   const maxDimension=Math.max(size.x,size.y,size.z);
   if(!Number.isFinite(maxDimension)||maxDimension<=0){status.textContent='海龜模型尺寸異常';return;}
   turtle.scale.setScalar(0.98/maxDimension);
   turtle.updateMatrixWorld(true);
   const centered=new THREE.Box3().setFromObject(turtle);
   const center=centered.getCenter(new THREE.Vector3());
   turtle.position.sub(center);
   anchor.add(turtle);anchor.remove(ball);
   if(gltf.animations.length){
    mixer=new THREE.AnimationMixer(turtle);
    for(const clip of gltf.animations){mixer.clipAction(clip).setLoop(THREE.LoopRepeat,Infinity).play();}
   }
   modelReady=true;
   if(active && orientationReady)status.textContent='輕點螢幕可餵食氣泡互動 ✨';
   draco.dispose();
  },error=>{console.error('海龜解析失敗',error);status.textContent='海龜解碼失敗：'+(error?.message||String(error));});
 }catch(error){console.error(error);status.textContent='海龜下載失敗：'+error.message;}
}
loadTurtle();

const dirNames=['N','NE','E','SE','S','SW','W','NW'];
function updateHUDCompass(){
 const yawDeg=(THREE.MathUtils.radToDeg(trackedEuler.y)%360+360)%360;
 const heading=Math.round((360-yawDeg)%360);
 const dirLabel=dirNames[Math.round(heading/45)%8];
 compassHeading.textContent=`${String(heading).padStart(3,'0')}° ${dirLabel}`;
 compassTicks.style.transform=`translateX(${-heading}px)`;

 const turtleWorldAngle=Math.atan2(anchor.position.x,-anchor.position.z);
 const cameraYaw=-trackedEuler.y;
 let diff=turtleWorldAngle-cameraYaw;
 diff=Math.atan2(Math.sin(diff),Math.cos(diff));
 const diffDeg=THREE.MathUtils.radToDeg(diff);

 const clamped=THREE.MathUtils.clamp(diffDeg,-60,60);
 const percent=50+(clamped/60)*40;
 turtleBlip.style.left=percent+'%';

 if(diffDeg<-42){
  turtleBlip.classList.add('offscreen');
  hintLeft.style.display='flex';
  hintRight.style.display='none';
 }else if(diffDeg>42){
  turtleBlip.classList.add('offscreen');
  hintRight.style.display='flex';
  hintLeft.style.display='none';
 }else{
  turtleBlip.classList.remove('offscreen');
  hintLeft.style.display='none';
  hintRight.style.display='none';
 }
}

// 更新伴游小魚群的軌道游動與尾鰭擺動
function updateFishSchool(time,speedMultiplier){
 for(const fish of fishSchool){
  const angle=time*fish.speed+fish.phase;
  const x=Math.cos(angle)*fish.radiusX;
  const z=Math.sin(angle)*fish.radiusZ;
  const y=fish.baseY+Math.sin(time*1.6+fish.phase)*fish.bobAmp;
  fish.mesh.position.set(x,y,z);

  // 計算切線方向，讓魚頭永遠精準朝向前進方向
  const dx=-Math.sin(angle)*fish.radiusX*fish.speed;
  const dz=Math.cos(angle)*fish.radiusZ*fish.speed;
  fish.mesh.rotation.y=Math.atan2(-dz,dx);

  // 魚身微微左右搖擺＋尾鰭快速擺動
  const wiggle=Math.sin(time*fish.tailSpeed*speedMultiplier+fish.phase);
  fish.tailPivot.rotation.y=wiggle*0.55;
  fish.mesh.rotation.y+=wiggle*0.06;
 }
}

function animate(){
 requestAnimationFrame(animate);
 const delta=Math.min(clock.getDelta(),.05);

 let speedMultiplier=1;
 if(boostTimer>0){
  boostTimer-=delta;
  speedMultiplier=2.1;
 }

 if(mixer)mixer.update(delta*speedMultiplier);

 if(active&&trackingGranted&&hasOrientation&&orientationReady){
  relativeQ.copy(latestQ).multiply(inverseOriginQ);
  trackedEuler.setFromQuaternion(relativeQ,'YXZ');
  if(originBeta!==null&&latestBeta!==null){
   let pitch=latestBeta-originBeta;
   pitch=Math.atan2(Math.sin(pitch),Math.cos(pitch));
   trackedEuler.x=THREE.MathUtils.clamp(pitch,-Math.PI/2,Math.PI/2);
  }
  camera.quaternion.setFromEuler(trackedEuler);
  updateHUDCompass();
 }

 if(active&&orientationReady){
  swimTime+=delta*speedMultiplier;
  if(modelReady){
   const t=swimTime*.45;
   const localOffset=new THREE.Vector3(.42*Math.sin(t),.12*Math.sin(t*.7),.28*(Math.cos(t)-1));
   anchor.position.copy(basePosition).add(localOffset);
  }
  updateFishSchool(swimTime,speedMultiplier);
 }
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
