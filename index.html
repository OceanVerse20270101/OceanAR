<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>OceanAR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131c;font-family:system-ui,sans-serif}
#camera,#scene{position:fixed;inset:0;width:100%;height:100%}
#camera{object-fit:cover}
#ocean-filter{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;background:linear-gradient(180deg,rgba(0,100,155,.24),rgba(0,150,180,.13) 55%,rgba(0,70,145,.29));mix-blend-mode:screen}
#ocean-filter::before{content:"";position:absolute;inset:-35%;background:repeating-linear-gradient(112deg,transparent 0 55px,rgba(160,245,255,.10) 70px,transparent 110px);transform-origin:center top;animation:rays 9s ease-in-out infinite alternate}
#ocean-filter::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 5%,rgba(160,240,255,.20),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
.bubble{position:absolute;bottom:-12vh;left:var(--x);width:var(--s);height:var(--s);border:1.5px solid rgba(210,255,255,.55);border-radius:50%;box-shadow:inset -2px -2px 5px rgba(185,245,255,.2),0 0 8px rgba(190,255,255,.15);animation:float-up var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes float-up{from{transform:translate3d(0,0,0);opacity:0}10%{opacity:.65}85%{opacity:.6}to{transform:translate3d(var(--drift),-125vh,0);opacity:0}}
@keyframes rays{from{transform:translateX(-10%) rotate(-7deg)}to{transform:translateX(12%) rotate(7deg)}}
@keyframes glow{from{opacity:.4}to{opacity:1}}
#scene{pointer-events:none;z-index:2}
#panel{position:fixed;z-index:5;left:12px;right:12px;top:max(18px,env(safe-area-inset-top));color:white;text-align:center;text-shadow:0 1px 5px #000;font-size:15px}
#controls{position:fixed;z-index:6;left:0;right:0;bottom:max(36px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:14px;padding:15px 20px;background:#00a9ee;color:white;font-weight:700;font-size:17px}button:disabled{opacity:.5}#reset{display:none;background:#164e72}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<div id="ocean-filter" aria-hidden="true"></div>
<div id="panel">OceanAR 準備就緒，請點選啟動</div>
<div id="controls"><button id="start">啟動 OceanAR</button><button id="reset">重新定位</button></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
const video=document.getElementById('camera'),status=document.getElementById('panel');
const start=document.getElementById('start'),reset=document.getElementById('reset');
const oceanFilter=document.getElementById('ocean-filter');
for(let i=0;i<28;i++){
 const bubble=document.createElement('span');bubble.className='bubble';
 bubble.style.setProperty('--x',`${(i*37+11)%100}%`);
 bubble.style.setProperty('--s',`${5+(i*7)%18}px`);
 bubble.style.setProperty('--d',`${6+(i*13)%10}s`);
 bubble.style.setProperty('--delay',`${-(i*1.37)%15}s`);
 bubble.style.setProperty('--drift',`${(i%2?1:-1)*(12+(i*9)%65)}px`);
 oceanFilter.appendChild(bubble);
}
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.domElement.id='scene';document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x526a78,2.2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);
const anchor=new THREE.Group();scene.add(anchor);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.32,32,24),new THREE.MeshStandardMaterial({color:0x20e49b,roughness:.5}));anchor.add(ball);
let mixer=null,active=false,orientationReady=false,hasOrientation=false,latestQ=new THREE.Quaternion();
const clock=new THREE.Clock();
const zee=new THREE.Vector3(0,0,1),screenQ=new THREE.Quaternion(),deviceQ=new THREE.Quaternion();
const correction=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const euler=new THREE.Euler(0,0,0,'YXZ');
function readOrientation(event){
 if(event.alpha==null||event.beta==null||event.gamma==null)return;
 euler.set(THREE.MathUtils.degToRad(event.beta),THREE.MathUtils.degToRad(event.alpha),-THREE.MathUtils.degToRad(event.gamma),'YXZ');
 deviceQ.setFromEuler(euler);deviceQ.multiply(correction);
 const angle=screen.orientation?.angle??window.orientation??0;
 screenQ.setFromAxisAngle(zee,-THREE.MathUtils.degToRad(Number(angle)));
 latestQ.copy(deviceQ).multiply(screenQ);hasOrientation=true;
 if(active&&!orientationReady)recenter();
}
window.addEventListener('deviceorientation',readOrientation,true);
function recenter(){
 if(!hasOrientation){status.textContent='等待方向感測器資料，請輕輕轉動手機';return;}
 camera.quaternion.copy(latestQ);
 anchor.position.set(0,0,0).add(new THREE.Vector3(0,0,-2).applyQuaternion(latestQ));
 // anchor keeps world position while the camera rotates
 orientationReady=true;status.textContent='OceanAR 已啟動｜左右轉動手機測試';
}
reset.addEventListener('click',recenter);
async function begin(){
 start.disabled=true;
 try{
  // On iOS the permission request must happen directly in the click gesture, before any await.
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
   const granted=await DeviceOrientationEvent.requestPermission();
   if(granted!=='granted')throw Error('方向感測器未授權');
  }
  status.textContent='正在開啟相機…';
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  video.srcObject=stream;await video.play();
  active=true;oceanFilter.style.display='block';start.style.display='none';reset.style.display='inline-block';
  recenter();
 }catch(err){status.textContent='啟動失敗：'+err.message;start.disabled=false;}
}
start.addEventListener('click',begin);
const draco=new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader=new GLTFLoader();loader.setDRACOLoader(draco);
status.textContent='OceanAR 準備就緒｜正在載入海龜';
loader.load('./turtle.glb',gltf=>{
 const turtle=gltf.scene;
 // Normalize the model size and center so it stays visible regardless of authoring units.
 turtle.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(turtle);
 const size=bounds.getSize(new THREE.Vector3());
 const maxDimension=Math.max(size.x,size.y,size.z);
 if(!Number.isFinite(maxDimension)||maxDimension<=0){status.textContent='海龜模型尺寸異常';return;}
 turtle.scale.setScalar(1.1/maxDimension);
 turtle.updateMatrixWorld(true);
 const centered=new THREE.Box3().setFromObject(turtle);
 const center=centered.getCenter(new THREE.Vector3());
 turtle.position.sub(center);
 anchor.add(turtle);anchor.remove(ball);
 if(gltf.animations.length){
  mixer=new THREE.AnimationMixer(turtle);
  const clip=gltf.animations.reduce((best,clip)=>clip.tracks.length>best.tracks.length?clip:best,gltf.animations[0]);
  mixer.clipAction(clip).play();
 }
 status.textContent='海龜已載入｜點擊啟動 OceanAR';
 draco.dispose();
},undefined,error=>{
 console.error('海龜載入失敗',error);
 status.textContent='海龜載入失敗：'+(error?.message||String(error));
});
function animate(){requestAnimationFrame(animate);const delta=clock.getDelta();if(mixer)mixer.update(delta);if(active&&hasOrientation)camera.quaternion.copy(latestQ);renderer.render(scene,camera)}animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
