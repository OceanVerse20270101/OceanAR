<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>OceanAR · 潛水員實境面鏡</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041524;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;user-select:none;-webkit-user-select:none}
#camera,#scene{position:fixed;inset:0;width:100%;height:100%}
#camera{object-fit:cover}

/* 淺海濾鏡與氣泡 */
#ocean-filter{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;background:linear-gradient(180deg,rgba(0,100,155,.24),rgba(0,150,180,.13) 55%,rgba(0,70,145,.29));mix-blend-mode:screen}
#ocean-filter::before{content:"";position:absolute;inset:-35%;background:repeating-linear-gradient(112deg,transparent 0 55px,rgba(160,245,255,.10) 70px,transparent 110px);transform-origin:center top;animation:rays 9s ease-in-out infinite alternate}
#ocean-filter::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 5%,rgba(160,240,255,.20),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
.bubble{position:absolute;bottom:-12vh;left:var(--x);width:var(--s);height:var(--s);border:1.5px solid rgba(210,255,255,.55);border-radius:50%;box-shadow:inset -2px -2px 5px rgba(185,245,255,.2),0 0 8px rgba(190,255,255,.15);animation:float-up var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes float-up{from{transform:translate3d(0,0,0);opacity:0}10%{opacity:.65}85%{opacity:.6}to{transform:translate3d(var(--drift),-125vh,0);opacity:0}}
@keyframes rays{from{transform:translateX(-10%) rotate(-7deg)}to{transform:translateX(12%) rotate(7deg)}}
@keyframes glow{from{opacity:.4}to{opacity:1}}

/* 深海模式與探照光圈 */
#deep-filter{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;overflow:hidden;background:linear-gradient(180deg,rgba(1,13,39,.72),rgba(0,20,54,.79) 55%,rgba(0,8,31,.86))}
#deep-filter::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 48% 15%,rgba(44,137,186,.22),transparent 55%);animation:deep-pulse 9s ease-in-out infinite alternate}
#deep-flashlight{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;background:radial-gradient(circle 42vmax at 50% 48%,rgba(130,225,255,.16) 0%,rgba(20,90,140,.08) 45%,rgba(0,6,20,.68) 100%);mix-blend-mode:screen}
.marine-snow{position:absolute;bottom:-8vh;left:var(--x);width:var(--s);height:var(--s);background:rgba(141,228,242,.68);border-radius:50%;box-shadow:0 0 8px rgba(99,213,255,.45);animation:float-up var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes deep-pulse{from{opacity:.4}to{opacity:1}}
body.deep #deep-filter,body.deep #deep-flashlight{display:block}
body.deep #sunlight,body.deep #ocean-filter{display:none!important}

/* 陽光折射 */
#sunlight{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;mix-blend-mode:screen;opacity:.85}
#sunlight .sun-glow{position:absolute;inset:-10%;background:radial-gradient(ellipse 60% 48% at 26% -8%,rgba(255,251,204,.32),rgba(142,227,255,.10) 43%,transparent 76%);animation:sun-breathe 8s ease-in-out infinite alternate}
#sunlight .sun-rays{position:absolute;left:-30%;top:-45%;width:160%;height:165%;transform-origin:35% 0%;background:repeating-conic-gradient(from 160deg at 35% 0%,rgba(255,252,215,0) 0deg,rgba(255,250,205,.14) 3deg,rgba(255,248,205,.035) 7deg,transparent 12deg,transparent 20deg);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.55) 55%,transparent 96%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.55) 55%,transparent 96%);animation:sun-sway 11s ease-in-out infinite alternate}
#sunlight .caustics{position:absolute;inset:-20%;background:repeating-linear-gradient(112deg,transparent 0 65px,rgba(205,250,255,.075) 72px,transparent 91px),repeating-linear-gradient(65deg,transparent 0 120px,rgba(190,246,255,.045) 132px,transparent 150px);filter:blur(9px);opacity:.7;animation:caustic-drift 13s ease-in-out infinite alternate}
@keyframes sun-sway{from{transform:rotate(-5deg) translateX(-2%);opacity:.65}to{transform:rotate(6deg) translateX(3%);opacity:1}}
@keyframes sun-breathe{from{opacity:.65;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}
@keyframes caustic-drift{from{transform:translate(-4%,-2%) rotate(-3deg)}to{transform:translate(4%,3%) rotate(4deg)}}

#scene{pointer-events:none;z-index:2}

/* ================= 潛水員面鏡 HUD 介面 ================= */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
.hud-corner{position:fixed;width:22px;height:22px;border-color:rgba(155,235
