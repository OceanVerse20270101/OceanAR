<!DOCTYPE html>
<html lang="zh-TW">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>OceanAR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#arCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#start {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 30px;
    background: #00aaff;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    z-index: 10;
}

#status {
    position: fixed;
    top: 20px;
    left: 10px;
    right: 10px;
    color: white;
    text-align: center;
    z-index: 5;
    text-shadow: 0 1px 4px black;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<div id="status">OceanAR 準備中</div>

<button id="start">啟動 OceanAR</button>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.domElement.id = "arCanvas";
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(2, 5, 3);
scene.add(light);

// 測試物件：綠色球
const geometry = new THREE.SphereGeometry(0.35, 32, 32);
const material = new THREE.MeshStandardMaterial({
    color: 0x00dd88
});

const testObject = new THREE.Mesh(geometry, material);
scene.add(testObject);

const mixerClock = new THREE.Clock();
let mixer = null;
let modelLoaded = false;

// 載入海龜模型
const loader = new GLTFLoader();

loader.load(
    "./turtle.glb",
    (gltf) => {
        scene.remove(testObject);

        const turtle = gltf.scene;
        turtle.scale.setScalar(0.7);
        scene.add(turtle);

        if (gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(turtle);
            mixer.clipAction(gltf.animations[0]).play();
        }

        modelLoaded = true;
    },
    undefined,
    () => {
        console.log("沒有海龜模型，使用測試球");
    }
);

// 手機方向
let initialOrientation = null;
let latestOrientation = null;
let started = false;

// 將手機方向轉換為 Three.js 相機旋轉
function orientationQuaternion(alpha, beta, gamma) {
    const euler = new THREE.Euler(
        THREE.MathUtils.degToRad(beta),
        THREE.MathUtils.degToRad(alpha),
        -THREE.MathUtils.degToRad(gamma),
        "YXZ"
    );

    const q = new THREE.Quaternion();
    q.setFromEuler(euler);

    const correction = new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );

    q.multiply(correction);

    const angle = THREE.MathUtils.degToRad(
        screen.orientation?.angle || 0
    );

    const screenRotation = new THREE.Quaternion();
    screenRotation.setFromAxisAngle(
        new THREE.Vector3(0, 0, 1),
        -angle
    );

    q.multiply(screenRotation);
    return q;
}

window.addEventListener("deviceorientation", (event) => {
    if (
        event.alpha === null ||
        event.beta === null ||
        event.gamma === null
    ) return;

    latestOrientation = orientationQuaternion(
        event.alpha,
        event.beta,
        event.gamma
    );

    if (started && initialOrientation === null) {
        initialOrientation = latestOrientation.clone();

        // 讓物件出生在目前手機朝向的前方
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(initialOrientation);

        const spawn = forward.multiplyScalar(2);
        testObject.position.copy(spawn);

        // 若已載入海龜，也同步定位
        if (modelLoaded) {
            const turtle = scene.children.find(
                child => child.type === "Group"
            );
            if (turtle) turtle.position.copy(spawn);
        }
    }
});

async function startAR() {
    const status = document.getElementById("status");

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" }
            },
            audio: false
        });

        document.getElementById("camera").srcObject = stream;

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {
                throw new Error("方向感測器未授權");
            }
        }

        started = true;
        document.getElementById("start").style.display = "none";
        status.textContent = "OceanAR 已啟動";

    } catch (error) {
        status.textContent = "啟動失敗：" + error.message;
    }
}

document.getElementById("start").addEventListener(
    "click",
    startAR
);

function animate() {
    requestAnimationFrame(animate);

    const delta = mixerClock.getDelta();

    if (mixer) mixer.update(delta);

    if (latestOrientation && initialOrientation) {
        camera3D.quaternion.copy(latestOrientation);
    }

    renderer.render(scene, camera3D);
}

animate();

window.addEventListener("resize", () => {
    camera3D.aspect =
        window.innerWidth / window.innerHeight;

    camera3D.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>
</body>
</html>
